packages:
  - apps/*
  - packages/*

catalog:
  "@vitest/coverage-v8": 5.1.0
  typescript: 6.0.3
  vitest: 5.1.0

minimumReleaseAge: 4320 # three days, in minutes
# Refuses a version published with weaker trust evidence than the ones before it, a sign of a
# hijacked maintainer account.
trustPolicy: no-downgrade
# Published by hand after its CI failed, as its maintainer confirmed in evilmartians/lefthook#1600;
# its platform binaries carry provenance. Any later version must pass.
trustPolicyExclude:
  - lefthook@2.2.2

# Git hooks are installed manually.
allowBuilds:
  lefthook: false
